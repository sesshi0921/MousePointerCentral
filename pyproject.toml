[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mouse-mcp"
version = "0.1.0"
description = "Mouse pointer control MCP server"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mcp",
  "pyautogui",
  "pydantic>=2,<3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
